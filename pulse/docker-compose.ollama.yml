# Opt-in overlay: never deploy this on the 8GB production host without load tests.
# docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d ollama
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "1m"
    volumes:
      - ollama_models:/root/.ollama
    # API accessible to other Docker services only. Do not publish 11434.
    mem_limit: 4g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 4

volumes:
  ollama_models:
