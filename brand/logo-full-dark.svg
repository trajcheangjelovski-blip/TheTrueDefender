<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 48" width="258" height="48" role="img" aria-label="The True Defender">
  <defs>
    <linearGradient id="ttdMarkDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e33b4e"/>
      <stop offset="1" stop-color="#8b1e2c"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect x="2" y="3" width="42" height="42" rx="12" fill="url(#ttdMarkDark)"/>
  <rect x="2.5" y="3.5" width="41" height="41" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="23" y="24.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Archivo','Arial Black',sans-serif" font-weight="900" font-size="15"
        letter-spacing="0.3" fill="#ffffff">TTD</text>
  <!-- Wordmark -->
  <text x="56" y="24.5" dominant-baseline="central"
        font-family="'Archivo','Arial Black',sans-serif" font-weight="800" font-size="19" letter-spacing="-0.2">
    <tspan fill="#eef0f8">The True </tspan><tspan fill="#ff6b7d">Defender</tspan>
  </text>
</svg>
